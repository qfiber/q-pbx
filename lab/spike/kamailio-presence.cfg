#!KAMAILIO
# Phase 2 spike (2-0a), lab only: Kamailio as presence server for busy lamps, presence and
# voicemail lights. States arrive as JSON on a localhost-only HTTP endpoint (/presence) and
# go into the presence module through pua_json; Kamailio answers the phones' SUBSCRIBEs and
# sends the NOTIFYs. Static test users stand in for the real database lookup (task 2-3).
# Deployed by hand over the Ansible-managed config; the next playbook run puts that back.

#!define SVC "__SERVICE_IP__"

debug=2
log_stderror=no
log_facility=LOG_LOCAL0
children=4
auto_aliases=no
listen=udp:SVC:5060
listen=tcp:SVC:5060
listen=tcp:127.0.0.1:5071
alias="pbx.lab.test"

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "auth.so"
loadmodule "htable.so"
loadmodule "json.so"
loadmodule "xhttp.so"
loadmodule "jsonrpcs.so"
loadmodule "presence.so"
loadmodule "presence_xml.so"
loadmodule "presence_dialoginfo.so"
loadmodule "presence_mwi.so"
loadmodule "pua_json.so"

modparam("jsonrpcs", "transport", 1)
modparam("usrloc", "db_mode", 0)
# Static spike users (tenant domain pbx.lab.test). Real credentials come from the database in 2-3.
modparam("htable", "htable", "users=>size=4;")
# Presence state lives in memory: it is runtime state, rebuilt from Elixir's events.
modparam("presence", "publ_cache", 2)
modparam("presence", "subs_db_mode", 0)
modparam("presence", "server_address", "sip:presence@SVC:5060")
modparam("presence_xml", "force_active", 1)
modparam("presence_xml", "disable_winfo", 1)
modparam("presence_xml", "force_dummy_presence", 1)
# An extension with no state yet must read as idle, not unknown, on every phone.
modparam("presence_dialoginfo", "force_dummy_dialog", 1)

event_route[htable:mod-init] {
  $sht(users=>101) = "spike-pass-101";
  $sht(users=>102) = "spike-pass-102";
}

request_route {
  if ($Rp == 5071) { drop; }
  if (!mf_process_maxfwd_header("10")) { sl_send_reply("483", "Too Many Hops"); exit; }

  if (is_method("REGISTER|SUBSCRIBE")) {
    if (!pv_auth_check("$fd", "$sht(users=>$fU)", "0", "1")) {
      auth_challenge("$fd", "0");
      exit;
    }
    consume_credentials();
  }

  if (is_method("REGISTER")) { save("location"); exit; }

  if (is_method("SUBSCRIBE")) {
    if (!t_newtran()) { sl_reply_error(); exit; }
    handle_subscribe();
    t_release();
    exit;
  }

  if (has_totag() && loose_route()) { t_relay(); exit; }
  sl_send_reply("503", "Service Unavailable");
}

event_route[xhttp:request] {
  if ($Rp != 5071 || $si != "127.0.0.1") { xhttp_reply("403", "Forbidden", "", ""); exit; }
  if ($hu =~ "^/RPC") { jsonrpc_dispatch(); exit; }
  if ($hu =~ "^/presence") {
    if (pua_json_publish($rb)) {
      xhttp_reply("200", "OK", "text/plain", "ok\n");
    } else {
      xhttp_reply("400", "Bad Request", "text/plain", "rejected\n");
    }
    exit;
  }
  xhttp_reply("404", "Not Found", "", "");
}
