# The call-test container (ci/calls/): systemd + SSH on 127.0.0.1:2222.
all:
  children:
    qpbx:
      hosts:
        qpbx-ci:
          ansible_host: 127.0.0.1
          ansible_port: 2222
          ansible_user: debian
          ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'QPBX_CI_KEY') }}"
          ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes
