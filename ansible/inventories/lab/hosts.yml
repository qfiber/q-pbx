# Local libvirt lab VM (lab/create-vm.sh prints its address).
all:
  children:
    qpbx:
      hosts:
        qpbx-lab:
          ansible_host: 192.168.10.25
          ansible_user: debian
          ansible_ssh_private_key_file: ~/.local/share/qpbx-lab/id_ed25519
          ansible_ssh_common_args: -o UserKnownHostsFile=~/.local/share/qpbx-lab/known_hosts -o IdentitiesOnly=yes
