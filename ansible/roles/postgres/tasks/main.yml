# PostgreSQL 16 from the PostgreSQL project's repository (Debian 12 ships 15).
- name: Repository key
  ansible.builtin.get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /usr/share/keyrings/pgdg.asc
    mode: "0644"

- name: Repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pgdg.list
    content: "deb [signed-by=/usr/share/keyrings/pgdg.asc] https://apt.postgresql.org/pub/repos/apt bookworm-pgdg main\n"
    mode: "0644"
  register: pgdg_repo

- name: Packages
  ansible.builtin.apt:
    name: [postgresql-16, python3-psycopg2]
    state: present
    update_cache: "{{ pgdg_repo.changed }}"

- name: Listen on localhost only
  ansible.builtin.lineinfile:
    path: /etc/postgresql/16/main/postgresql.conf
    regexp: "^#?listen_addresses"
    line: "listen_addresses = 'localhost'"
  notify: Restart postgresql

- name: Unit drop-in folder
  ansible.builtin.file:
    path: /etc/systemd/system/postgresql@16-main.service.d
    state: directory
    mode: "0755"

- name: Hardening drop-in
  ansible.builtin.template:
    src: hardening.conf.j2
    dest: /etc/systemd/system/postgresql@16-main.service.d/qpbx.conf
    mode: "0644"
  register: postgres_hardening

- name: Apply hardening now (the database must be up for the next tasks)
  ansible.builtin.systemd:
    name: postgresql@16-main
    state: restarted
    daemon_reload: true
  when: postgres_hardening.changed  # noqa: no-handler

- name: Running
  ansible.builtin.systemd:
    name: postgresql
    enabled: true
    state: started

- name: Database password
  ansible.builtin.include_role:
    name: qpbx_app
    tasks_from: secrets

# Two roles: qpbx_owner owns the schema and runs migrations; the app connects as qpbx with
# data rights only (no schema changes; the audit log is append-only, see its migration).
# Neither is a superuser, so row-level security applies.
- name: Roles
  community.postgresql.postgresql_user:
    name: "{{ item.name }}"
    password: "{{ item.password }}"
    role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE
  loop:
    - {name: qpbx_owner, password: "{{ qpbx_secrets.db_owner_password }}"}
    - {name: qpbx, password: "{{ qpbx_secrets.db_password }}"}
    - {name: qpbx_kamailio, password: "{{ qpbx_secrets.kamailio_db_password }}"}
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  become: true
  become_user: postgres

- name: Database owned by the owner role
  community.postgresql.postgresql_db:
    name: qpbx
    owner: qpbx_owner
    encoding: UTF8
  become: true
  become_user: postgres

- name: Hand objects created before the role split to the owner role
  community.postgresql.postgresql_query:
    login_db: qpbx
    query: |
      DO $$ BEGIN
        IF EXISTS (SELECT 1 FROM pg_tables WHERE schemaname = 'public' AND tableowner = 'qpbx') THEN
          REASSIGN OWNED BY qpbx TO qpbx_owner;
        END IF;
      END $$;
  changed_when: false
  become: true
  become_user: postgres

- name: App role rights (data only, for existing and future tables)
  community.postgresql.postgresql_query:
    login_db: qpbx
    query: |
      ALTER SCHEMA public OWNER TO qpbx_owner;
      REVOKE CREATE ON SCHEMA public FROM PUBLIC;
      GRANT CONNECT ON DATABASE qpbx TO qpbx;
      GRANT USAGE ON SCHEMA public TO qpbx;
      GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO qpbx;
      ALTER DEFAULT PRIVILEGES FOR ROLE qpbx_owner IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO qpbx;
      ALTER DEFAULT PRIVILEGES FOR ROLE qpbx_owner IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO qpbx;
      -- Existing tables: full data rights, except the append-only audit log.
      DO $$ DECLARE t text; BEGIN
        FOR t IN SELECT tablename FROM pg_tables WHERE schemaname = 'public' LOOP
          IF t = 'audit_logs' THEN
            EXECUTE format('GRANT SELECT, INSERT ON %I TO qpbx', t);
          ELSE
            EXECUTE format('GRANT SELECT, INSERT, UPDATE, DELETE ON %I TO qpbx', t);
          END IF;
        END LOOP;
      END $$;
  changed_when: false
  become: true
  become_user: postgres

# Kamailio reads only the views in the kamailio schema (credential hashes, tenant domains).
# The schema comes from a migration; on a fresh install it appears with the app's first start,
# which grants these rights itself (QPBX_DB_KAMAILIO_ROLE).
- name: Kamailio role rights (read the kamailio views, nothing else)
  community.postgresql.postgresql_query:
    login_db: qpbx
    query: |
      ALTER ROLE qpbx_kamailio SET search_path = kamailio;
      GRANT CONNECT ON DATABASE qpbx TO qpbx_kamailio;
      DO $$ BEGIN
        IF EXISTS (SELECT 1 FROM pg_namespace WHERE nspname = 'kamailio') THEN
          GRANT USAGE ON SCHEMA kamailio TO qpbx_kamailio;
          GRANT SELECT ON ALL TABLES IN SCHEMA kamailio TO qpbx_kamailio;
          ALTER DEFAULT PRIVILEGES FOR ROLE qpbx_owner IN SCHEMA kamailio GRANT SELECT ON TABLES TO qpbx_kamailio;
        END IF;
      END $$;
  changed_when: false
  become: true
  become_user: postgres

- name: Client authentication (scram on localhost only, for the Q-PBX roles)
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: /etc/postgresql/16/main/pg_hba.conf
    owner: postgres
    group: postgres
    mode: "0640"
  notify: Reload postgresql
