# Tools and settings to reach the repository (backups and restores both need them).
- name: Packages (pgBackRest from the PostgreSQL repository, restic from Debian)
  ansible.builtin.apt:
    name: [pgbackrest, restic]
    state: present

# Trusted on first use, per address: a target that moves to a new address is scanned once
# there (the old entry stays; it is only ever matched for the old address).
- name: Target host key (trusted on first use)
  ansible.builtin.shell: |
    set -o pipefail
    name="{{ qpbx_backup_host if qpbx_backup_port | int == 22 else '[' ~ qpbx_backup_host ~ ']:' ~ qpbx_backup_port }}"
    touch /etc/qpbx-backup/known_hosts
    if ssh-keygen -F "$name" -f /etc/qpbx-backup/known_hosts >/dev/null; then
      echo known
    else
      ssh-keyscan -p {{ qpbx_backup_port }} -t ed25519,ecdsa,rsa {{ qpbx_backup_host }} | grep -v '^#' >> /etc/qpbx-backup/known_hosts
      echo added
    fi
  args:
    executable: /bin/bash
  register: backup_known_host
  changed_when: "'added' in backup_known_host.stdout"

- name: Known hosts readable by postgres
  ansible.builtin.file:
    path: /etc/qpbx-backup/known_hosts
    owner: root
    group: postgres
    mode: "0640"

- name: Root's SSH folder
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    mode: "0700"

# restic reaches the target through this alias (its key and the pinned host key).
- name: SSH alias for the backup target
  ansible.builtin.blockinfile:
    path: /root/.ssh/config
    create: true
    mode: "0600"
    marker: "# {mark} Q-PBX backup target"
    block: |
      Host qpbx-backup-target
          HostName {{ qpbx_backup_host }}
          Port {{ qpbx_backup_port }}
          User {{ qpbx_backup_user }}
          IdentityFile /etc/qpbx-backup/id_ed25519
          IdentitiesOnly yes
          UserKnownHostsFile /etc/qpbx-backup/known_hosts
          StrictHostKeyChecking yes
          BatchMode yes

- name: The restic password (a copy; the one in Ansible Vault is what a restore needs)
  ansible.builtin.copy:
    dest: /etc/qpbx-backup/restic-password
    content: "{{ qpbx_backup_password }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: The restic settings
  ansible.builtin.template:
    src: restic.env.j2
    dest: /etc/qpbx-backup/restic.env
    owner: root
    group: root
    mode: "0600"
