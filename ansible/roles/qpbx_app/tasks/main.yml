- name: Secrets
  ansible.builtin.include_tasks: secrets.yml

- name: Known human-check provider
  ansible.builtin.assert:
    that:
      - qpbx_captcha_provider in ['pow', 'turnstile', 'friendly_captcha', 'captcha_eu', 'none']
      - qpbx_captcha_provider in ['pow', 'none'] or (qpbx_captcha_site_key | length > 0 and qpbx_captcha_secret | length > 0)
    fail_msg: qpbx_captcha_provider must be pow, turnstile, friendly_captcha, captcha_eu or none; outside services need site key and secret.

- name: KMS settings complete, and the plain key backed up off the server
  ansible.builtin.assert:
    that:
      - qpbx_kms_region | length > 0
      - qpbx_kms_key_id | length > 0
      - qpbx_aws_access_key_id | length > 0
      - qpbx_aws_secret_access_key | length > 0
      - qpbx_kms_key_backed_up | bool
    fail_msg: >-
      aws_kms needs qpbx_kms_region, qpbx_kms_key_id and AWS credentials, and
      qpbx_kms_key_backed_up: true once the master key from /etc/qpbx/secrets.json is stored
      safely off the server (it is removed from the server after the switch).
  when: qpbx_key_provider == 'aws_kms'

- name: Wrapped master key present?
  ansible.builtin.stat:
    path: /etc/qpbx/master-key.kms
  register: qpbx_app_kms_blob

- name: Package cache folder
  ansible.builtin.file:
    path: /var/cache/qpbx
    state: directory
    mode: "0755"

- name: Copy package
  ansible.builtin.copy:
    src: "{{ qpbx_app_deb }}"
    dest: /var/cache/qpbx/
    mode: "0644"

- name: Install package
  ansible.builtin.apt:
    deb: "/var/cache/qpbx/{{ qpbx_app_deb | basename }}"
  notify: Restart qpbx

- name: Extra certificate authorities for outbound requests (webhooks)
  ansible.builtin.copy:
    dest: /etc/qpbx/outbound-ca.pem
    content: "{{ qpbx_outbound_ca_pem }}"
    owner: root
    group: qpbx
    mode: "0644"
  when: qpbx_outbound_ca_pem | length > 0
  notify: Restart qpbx

- name: No extra certificate authorities when none are set
  ansible.builtin.file:
    path: /etc/qpbx/outbound-ca.pem
    state: absent
  when: qpbx_outbound_ca_pem | length == 0
  notify: Restart qpbx

- name: Environment
  ansible.builtin.template:
    src: qpbx.env.j2
    dest: /etc/qpbx/qpbx.env
    owner: root
    group: qpbx
    mode: "0640"
  no_log: true
  notify: Restart qpbx

- name: CLI wrapper (runs release commands as qpbx with the environment)
  ansible.builtin.copy:
    dest: /usr/local/sbin/qpbx
    mode: "0750"
    content: |
      #!/bin/sh
      # Usage: qpbx eval 'QPBX.Release.setup_link("someone@example.com")'
      set -a
      . /etc/qpbx/qpbx.env
      set +a
      export HOME={{ qpbx_data_dir }} RELEASE_TMP=/tmp
      exec runuser -u qpbx -- /opt/qpbx/bin/qpbx "$@"

- name: Wrap the current master key with KMS (the key itself does not change)
  ansible.builtin.command:
    argv: [/usr/local/sbin/qpbx, eval, "QPBX.Release.kms_wrap_key()"]
  environment:
    QPBX_CLOAK_KEY: "{{ qpbx_secrets.cloak_key }}"
    QPBX_KMS_REGION: "{{ qpbx_kms_region }}"
    QPBX_KMS_KEY_ID: "{{ qpbx_kms_key_id }}"
    QPBX_KMS_ENDPOINT: "{{ qpbx_kms_endpoint }}"
    AWS_ACCESS_KEY_ID: "{{ qpbx_aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ qpbx_aws_secret_access_key }}"
  register: qpbx_app_wrapped
  changed_when: true
  no_log: true
  when: qpbx_key_provider == 'aws_kms' and not qpbx_app_kms_blob.stat.exists

- name: Store the wrapped key (useless without KMS access)
  ansible.builtin.copy:
    dest: /etc/qpbx/master-key.kms
    content: "{{ qpbx_app_wrapped.stdout_lines | last }}\n"
    owner: root
    group: qpbx
    mode: "0640"
  when: qpbx_app_wrapped is changed  # noqa: no-handler
  notify: Restart qpbx

- name: Unit
  ansible.builtin.template:
    src: qpbx.service.j2
    dest: /etc/systemd/system/qpbx.service
    mode: "0644"
  notify: Restart qpbx

- name: Running
  ansible.builtin.systemd:
    name: qpbx
    enabled: true
    state: started
    daemon_reload: true

- name: Restart now if anything changed, before checking health
  ansible.builtin.meta: flush_handlers

- name: Healthy
  ansible.builtin.uri:
    url: "http://127.0.0.1:4000/health"
    status_code: [200, 503]
  register: health
  until: health.status in [200, 503] and health.json is defined
  retries: 30
  delay: 2

# Healthy above means the app unwrapped its key through KMS; only now may the plain copy go.
- name: Remove the plain master key from the server (aws_kms)
  ansible.builtin.shell:
    cmd: |
      set -e
      umask 077
      python3 - <<'PY'
      import json, os
      path = "/etc/qpbx/secrets.json"
      s = json.load(open(path))
      if "cloak_key" in s:
          del s["cloak_key"]
          tmp = path + ".tmp"
          with open(tmp, "w") as f:
              json.dump(s, f)
          os.chmod(tmp, 0o600)
          os.replace(tmp, path)
          print("removed")
      PY
  register: qpbx_app_key_removed
  changed_when: "'removed' in qpbx_app_key_removed.stdout"
  when: qpbx_key_provider == 'aws_kms'

- name: Seed management IPs into the database (only if none exist yet)
  ansible.builtin.command:
    argv: [/usr/local/sbin/qpbx, eval, "QPBX.Release.seed_management_ips({{ qpbx_management_ips | to_json }})"]
  register: seed
  changed_when: "'added' in seed.stdout"

- name: AppArmor profile (complain mode)
  ansible.builtin.template:
    src: apparmor.j2
    dest: /etc/apparmor.d/qpbx-app
    mode: "0644"
    validate: apparmor_parser -Q %s
  notify: [Load AppArmor profile qpbx-app, Restart qpbx]
