# Secrets are generated once on the server and kept in /etc/qpbx/secrets.json (root, 0600).
# Back this file up: without the Cloak key, encrypted fields (TOTP secrets) cannot be read.
- name: Config folder
  ansible.builtin.file:
    path: /etc/qpbx
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Generate secrets once
  ansible.builtin.shell:
    cmd: |
      set -e
      umask 077
      python3 - > /etc/qpbx/secrets.json <<'PY'
      import base64, json, secrets
      print(json.dumps({
          "db_password": secrets.token_hex(24),
          "secret_key_base": secrets.token_urlsafe(64),
          "cloak_key": base64.b64encode(secrets.token_bytes(32)).decode(),
          "health_token": secrets.token_urlsafe(32),
          "esl_password": secrets.token_hex(16),
          "release_cookie": secrets.token_hex(32),
      }))
      PY
    creates: /etc/qpbx/secrets.json

- name: Read secrets
  ansible.builtin.slurp:
    src: /etc/qpbx/secrets.json
  register: secrets_file
  no_log: true

- name: Secrets as a fact
  ansible.builtin.set_fact:
    qpbx_secrets: "{{ secrets_file.content | b64decode | from_json }}"
  no_log: true
