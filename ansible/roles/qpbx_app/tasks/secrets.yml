# Secrets are generated once on the server and kept in /etc/qpbx/secrets.json (root, 0600).
# Back this file up: without the Cloak key, encrypted fields (TOTP secrets) cannot be read.
- name: Config folder
  ansible.builtin.file:
    path: /etc/qpbx
    state: directory
    owner: root
    group: root
    mode: "0755"

# Existing values are never changed; keys added in later versions are filled in.
- name: Generate missing secrets
  ansible.builtin.shell:
    cmd: |
      set -e
      umask 077
      python3 - <<'PY'
      import base64, json, os, secrets
      path = "/etc/qpbx/secrets.json"
      current = json.load(open(path)) if os.path.exists(path) else {}
      wanted = {
          "db_password": lambda: secrets.token_hex(24),
          "db_owner_password": lambda: secrets.token_hex(24),
          "kamailio_db_password": lambda: secrets.token_hex(24),
          "secret_key_base": lambda: secrets.token_urlsafe(64),
          "cloak_key": lambda: base64.b64encode(secrets.token_bytes(32)).decode(),
          "health_token": lambda: secrets.token_urlsafe(32),
          "esl_password": lambda: secrets.token_hex(16),
          "fs_curl_password": lambda: secrets.token_hex(24),
          "release_cookie": lambda: secrets.token_hex(32),
          # Encrypts the database backups (pgBackRest); restored with this file from restic.
          "pgbackrest_cipher": lambda: secrets.token_urlsafe(48),
      }
      # Once the master key is held by KMS, never generate a new local one (it would not
      # decrypt existing data).
      if os.path.exists("/etc/qpbx/master-key.kms"):
          wanted.pop("cloak_key")
      added = [k for k in wanted if k not in current]
      for k in added:
          current[k] = wanted[k]()
      if added:
          tmp = path + ".tmp"
          with open(tmp, "w") as f:
              json.dump(current, f)
          os.chmod(tmp, 0o600)
          os.replace(tmp, path)
      print("added: " + ",".join(added) if added else "unchanged")
      PY
  register: qpbx_app_secrets_gen
  changed_when: "'added' in qpbx_app_secrets_gen.stdout"

- name: Secrets file is root-only
  ansible.builtin.file:
    path: /etc/qpbx/secrets.json
    owner: root
    group: root
    mode: "0600"

- name: Read secrets
  ansible.builtin.slurp:
    src: /etc/qpbx/secrets.json
  register: secrets_file
  no_log: true

- name: Secrets as a fact
  ansible.builtin.set_fact:
    qpbx_secrets: "{{ secrets_file.content | b64decode | from_json }}"
  no_log: true
