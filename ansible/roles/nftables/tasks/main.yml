- name: Address Ansible connects from (sudo would strip SSH_CLIENT)
  ansible.builtin.shell: echo "${SSH_CLIENT%% *}"
  become: false
  register: nftables_ssh_client
  changed_when: false
  check_mode: false

- name: Management IPs are set and include the address Ansible connects from
  ansible.builtin.assert:
    that:
      - qpbx_management_ips | length > 0
      - qpbx_management_ips | map('ansible.utils.network_in_usable', controller_ip) | select | list | length > 0
      - qpbx_management_ips | map('ansible.utils.ipaddr') | select | list | length == qpbx_management_ips | length
    fail_msg: >-
      qpbx_management_ips must list valid addresses including {{ controller_ip }},
      or applying the firewall would cut this SSH session.
  vars:
    controller_ip: "{{ nftables_ssh_client.stdout }}"

- name: Packages
  ansible.builtin.apt:
    name: [nftables]
    state: present

- name: Firewall helper user (gets CAP_NET_ADMIN only through systemd)
  ansible.builtin.user:
    name: qpbx-fwd
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/qpbx-fwd
    create_home: false

- name: Base ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0644"
    validate: nft -c -f %s
  notify: Reload nftables

- name: Nftables enabled
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started

- name: Package cache folder
  ansible.builtin.file:
    path: /var/cache/qpbx
    state: directory
    mode: "0755"

- name: Copy qpbx-fwd package
  ansible.builtin.copy:
    src: "{{ qpbx_fwd_deb }}"
    dest: /var/cache/qpbx/
    mode: "0644"

- name: Install package
  ansible.builtin.apt:
    deb: "/var/cache/qpbx/{{ qpbx_fwd_deb | basename }}"
  notify: Restart qpbx-fwd

- name: Unit for qpbx-fwd
  ansible.builtin.template:
    src: qpbx-fwd.service.j2
    dest: /etc/systemd/system/qpbx-fwd.service
    mode: "0644"
  notify: Restart qpbx-fwd

- name: Firewall helper running
  ansible.builtin.systemd:
    name: qpbx-fwd
    enabled: true
    state: started
    daemon_reload: true

- name: AppArmor profile (complain mode)
  ansible.builtin.template:
    src: apparmor.j2
    dest: /etc/apparmor.d/qpbx-fwd
    mode: "0644"
    validate: apparmor_parser -Q %s
  notify: [Load AppArmor profile qpbx-fwd, Restart qpbx-fwd]
