# Phase 1: Kamailio installed, listening on the service IPs (UDP/TCP 5060, TLS 5061) and
# answering 503 to every request; JSON-RPC over HTTP on localhost for the health check.
# Authentication, routing and bans arrive in phase 2.
# Kamailio 6.0 from the Kamailio project (Debian 12 ships 5.6, no longer maintained upstream).
# The key file (ASCII-armored, hence .asc) is pinned by checksum (Kamailio Package Team, E79ACECB...3E6508EA4C8).
- name: Repository key
  ansible.builtin.get_url:
    url: https://deb.kamailio.org/kamailiodebkey.gpg
    dest: /usr/share/keyrings/kamailio.asc
    checksum: sha256:dcb0adf461359f37f51a0a36d026282fda51beac5f9a82a5b6ae30c8db7a65d5
    mode: "0644"

- name: Repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kamailio.list
    content: "deb [signed-by=/usr/share/keyrings/kamailio.asc] https://deb.kamailio.org/kamailio60 bookworm main\n"
    mode: "0644"
  register: kamailio_repo

- name: Packages
  ansible.builtin.apt:
    name: [kamailio, kamailio-tls-modules, kamailio-presence-modules, kamailio-json-modules, kamailio-postgres-modules]
    state: present
    update_cache: "{{ kamailio_repo.changed }}"
  notify: Restart kamailio

- name: Kamailio can read the TLS certificate
  ansible.builtin.user:
    name: kamailio
    groups: [qpbx-tls]
    append: true
  notify: Restart kamailio

- name: Secrets
  ansible.builtin.include_role:
    name: qpbx_app
    tasks_from: secrets

- name: Database connection (kept out of the main config; readable by Kamailio only)
  ansible.builtin.copy:
    dest: /etc/kamailio/db.cfg
    content: |
      # Managed by Ansible (Q-PBX kamailio role).
      #!define DBURL "postgres://qpbx_kamailio:{{ qpbx_secrets.kamailio_db_password }}@127.0.0.1/qpbx"
    owner: root
    group: kamailio
    mode: "0640"
  no_log: true
  notify: Restart kamailio

- name: Main config
  ansible.builtin.template:
    src: kamailio.cfg.j2
    dest: /etc/kamailio/kamailio.cfg
    mode: "0644"
    validate: kamailio -c -f %s
  notify: Restart kamailio

- name: TLS config
  ansible.builtin.template:
    src: tls.cfg.j2
    dest: /etc/kamailio/tls.cfg
    mode: "0644"
  notify: Restart kamailio

- name: Unit drop-in folder
  ansible.builtin.file:
    path: /etc/systemd/system/kamailio.service.d
    state: directory
    mode: "0755"

- name: Hardening drop-in
  ansible.builtin.template:
    src: hardening.conf.j2
    dest: /etc/systemd/system/kamailio.service.d/qpbx.conf
    mode: "0644"
  notify: Restart kamailio

- name: Running
  ansible.builtin.systemd:
    name: kamailio
    daemon_reload: true
    enabled: true
    state: started

- name: AppArmor profile (complain mode)
  ansible.builtin.template:
    src: apparmor.j2
    dest: /etc/apparmor.d/qpbx-kamailio
    mode: "0644"
    validate: apparmor_parser -Q %s
  notify: [Load AppArmor profile qpbx-kamailio, Restart kamailio]
