- name: Load AppArmor profile qpbx-nginx
  ansible.builtin.command: apparmor_parser -r /etc/apparmor.d/qpbx-nginx
  changed_when: true

- name: Restart nginx
  ansible.builtin.systemd:
    name: nginx
    state: restarted
    daemon_reload: true

- name: Reload nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
