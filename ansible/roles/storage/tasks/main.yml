# Local file storage (the Storage behaviour's local backend). FreeSWITCH writes recordings and
# faxes, the app reads and serves them: both are in the qpbx-media group.
- name: Groups
  ansible.builtin.group:
    name: "{{ item }}"
    system: true
  loop: [qpbx, qpbx-media, qpbx-tls]

- name: App user
  ansible.builtin.user:
    name: qpbx
    group: qpbx
    groups: [qpbx-media, qpbx-tls, qpbx-fwd]
    system: true
    shell: /usr/sbin/nologin
    home: "{{ qpbx_data_dir }}"
    create_home: false

- name: Data folder
  ansible.builtin.file:
    path: "{{ qpbx_data_dir }}"
    state: directory
    owner: qpbx
    group: qpbx
    mode: "0750"

- name: Media folders
  ansible.builtin.file:
    path: "{{ qpbx_data_dir }}/{{ item }}"
    state: directory
    owner: qpbx
    group: qpbx-media
    mode: "2770"
  loop: [recordings, voicemail, faxes, prompts]

- name: Media group can enter the data folder
  ansible.posix.acl:
    path: "{{ qpbx_data_dir }}"
    entity: qpbx-media
    etype: group
    permissions: x
    state: present

# Plain media only briefly, in memory: FreeSWITCH records a voicemail here and the app encrypts
# it into storage; the app decrypts a greeting or message here for FreeSWITCH to play. Leftovers
# (a crash mid-call) are removed after a day.
- name: Shared media folder in tmpfs, created at every boot
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/qpbx-media.conf
    content: |
      d /run/qpbx-media 2770 qpbx qpbx-media 1d
    mode: "0644"
  register: media_tmpfiles

- name: Create the shared media folder now
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/qpbx-media.conf
  when: media_tmpfiles.changed  # noqa: no-handler
  changed_when: true
