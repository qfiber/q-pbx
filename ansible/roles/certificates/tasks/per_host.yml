# One certificate for the platform names through HTTP-01 (answered by nginx on port 80),
# and one per tenant SIP domain, issued by a timer within minutes of the tenant being created.
- name: ACME client
  ansible.builtin.include_tasks: acme.yml

- name: Bootstrap certificate so the app can start before the first issue
  ansible.builtin.include_tasks: selfsigned.yml

- name: Tenant certificate script (runs as qpbx-acme)
  ansible.builtin.template:
    src: qpbx-acme-tenants.j2
    dest: /usr/local/sbin/qpbx-acme-tenants
    owner: root
    group: qpbx-acme
    mode: "0750"

- name: Tenant certificate service and timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    mode: "0644"
  loop:
    - name: qpbx-acme-tenants.service
      content: |
        [Unit]
        Description=Issue certificates for new Q-PBX tenant domains
        After=qpbx.service
        [Service]
        Type=oneshot
        User=qpbx-acme
        Group=qpbx-acme
        RuntimeDirectory=qpbx-acme
        # Only listing the domains needs the app's environment (+ = run with privileges).
        ExecStartPre=+/bin/sh -c '/usr/local/sbin/qpbx eval "QPBX.Release.list_sip_domains()" > /run/qpbx-acme/domains'
        ExecStart=/usr/local/sbin/qpbx-acme-tenants /run/qpbx-acme/domains
        NoNewPrivileges=true
        CapabilityBoundingSet=
        ProtectSystem=strict
        ProtectHome=true
        PrivateTmp=true
        ReadWritePaths={{ certificates_acme_config }} {{ certificates_webroot }} {{ qpbx_tls_dir }}
    - name: qpbx-acme-tenants.timer
      content: |
        [Unit]
        Description=Check for new Q-PBX tenant domains every 5 minutes
        [Timer]
        OnBootSec=2min
        OnUnitActiveSec=5min
        [Install]
        WantedBy=timers.target

- name: Tenant certificate timer enabled
  ansible.builtin.systemd:
    name: qpbx-acme-tenants.timer
    enabled: true
    state: started
    daemon_reload: true
