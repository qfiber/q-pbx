# Defaults for every Q-PBX server. Override per inventory.

# Platform base domain: tenants get <slug>.<qpbx_domain>.
qpbx_domain: pbx.example.com
qpbx_portal_host: "portal.{{ qpbx_domain }}"
qpbx_sip_host: "sip.{{ qpbx_domain }}"

# Service IPs (dual-stack). Default: the host's primary addresses. Empty IPv6 = IPv4 only.
qpbx_service_ipv4: "{{ ansible_default_ipv4.address }}"
# A link-local address (fe80::, all a host without public IPv6 may have) cannot be a service IP.
qpbx_service_ipv6: "{{ '' if (ansible_default_ipv6.address | default('fe80')).startswith('fe80') else ansible_default_ipv6.address }}"

# SSH and the firewall seed. Must include the address Ansible connects from.
qpbx_management_ips: []

qpbx_rtp_port_min: 16384
qpbx_rtp_port_max: 32768

# Packages built by packaging/*/build-in-container.sh, on the machine running Ansible.
qpbx_packages_dir: "{{ playbook_dir }}/../out"
# Newest package of each kind in qpbx_packages_dir (file names carry the version).
qpbx_app_deb: "{{ lookup('ansible.builtin.fileglob', qpbx_packages_dir ~ '/qpbx_*_amd64.deb', wantlist=True) | sort | last }}"
qpbx_fwd_deb: "{{ lookup('ansible.builtin.fileglob', qpbx_packages_dir ~ '/qpbx-fwd_*_amd64.deb', wantlist=True) | sort | last }}"
qpbx_sounds_deb: "{{ lookup('ansible.builtin.fileglob', qpbx_packages_dir ~ '/qpbx-sounds_*_all.deb', wantlist=True) | sort | last }}"
qpbx_freeswitch_deb: "{{ lookup('ansible.builtin.fileglob', qpbx_packages_dir ~ '/qpbx-freeswitch_*_amd64.deb', wantlist=True) | sort | last }}"

# Certificates: selfsigned (labs), wildcard (DNS-01) or per_host (HTTP-01).
qpbx_cert_mode: wildcard
qpbx_tls_dir: /etc/qpbx/tls

# Master key for encrypted fields: local (in /etc/qpbx/secrets.json) or aws_kms (only a
# KMS-wrapped copy stays on the server). Switching to aws_kms removes the plain key from the
# server once the app runs with KMS, so first back the key up off the server and set
# qpbx_kms_key_backed_up: true.
qpbx_key_provider: local
qpbx_kms_region: ""
qpbx_kms_key_id: ""           # key ARN or alias
qpbx_kms_endpoint: ""         # empty = AWS; set only for a KMS-compatible test server
qpbx_aws_access_key_id: ""    # keep in Ansible Vault
qpbx_aws_secret_access_key: ""
qpbx_kms_key_backed_up: false

# Portal session idle timeout in seconds (at most 900; higher values are capped).
qpbx_session_idle_timeout: 900

# Human check on login and setup pages: pow (built-in), turnstile, friendly_captcha, captcha_eu, none.
qpbx_captcha_provider: pow
qpbx_captcha_site_key: ""
qpbx_captcha_secret: ""   # keep in Ansible Vault

# Email for setup links.
qpbx_mail_from: "noreply@{{ qpbx_domain }}"
qpbx_smtp_host: localhost
qpbx_smtp_port: 587
qpbx_smtp_username: ""
qpbx_smtp_password: ""

qpbx_data_dir: /var/lib/qpbx
# Backups (roles backup and backup_target): pgBackRest (database, encrypted, point in time)
# and restic (/etc/qpbx with the secrets file, and the data folder) over SFTP to another
# server. The backup password must also be kept off the server (Ansible Vault): without it
# the secrets file, and so everything else, cannot be restored.
qpbx_backup_enabled: false
qpbx_backup_host: ""                       # the target (in group qpbx_backup when Ansible manages it)
qpbx_backup_port: 22
qpbx_backup_user: qpbx-backup
qpbx_backup_name: "{{ qpbx_domain }}"      # this installation's folder on the target (stays the same after a restore)
qpbx_backup_password: ""                   # restic; keep in Ansible Vault and off the server
qpbx_backup_db_time: "*-*-* 01:30:00"       # daily; full on Sundays (and the first time), else differential
qpbx_backup_files_time: "*-*-* 02:30:00"
qpbx_backup_keep_full: 4                   # pgBackRest full backups kept (with their WAL)
qpbx_backup_keep_daily: 7                  # restic snapshots kept
qpbx_backup_keep_weekly: 4
qpbx_backup_keep_monthly: 6
# Set by the restore test only: the restored copy makes no backups of its own.
qpbx_restore_test: false

# True only for the call-test container (ci/calls/): no AppArmor kernel interface to load
# profiles into (they are still written and parsed) and no clock to set.
qpbx_in_container: false

# ACME (wildcard and per_host certificate modes).
qpbx_acme_email: ""
# acme.sh server: letsencrypt, letsencrypt_test, or a directory URL (lab: Pebble).
qpbx_acme_server: letsencrypt
# Wildcard mode: an acme.sh DNS plugin and its credentials (keep these in Ansible Vault).
qpbx_acme_dns_provider: dns_cf
qpbx_acme_dns_env: {}   # for Cloudflare: {CF_Token: "...", CF_Zone_ID: "..."}
# Labs only: trust a test ACME server's certificate (Pebble), and wait a fixed number of seconds
# for DNS-01 records instead of checking public resolvers (they cannot see a lab DNS server).
qpbx_acme_insecure: false
qpbx_acme_dns_sleep: 0
