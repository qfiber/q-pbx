# Builds a complete single Q-PBX server. Every host is in every group in version 1.
- name: Q-PBX server
  hosts: qpbx
  become: true
  pre_tasks:
    - name: Debian 12 only
      ansible.builtin.assert:
        that: ansible_distribution == "Debian" and ansible_distribution_major_version == "12"
        fail_msg: Q-PBX targets Debian 12.
  roles:
    - hardening
    - nftables
    - postgres
    - storage
    - certificates
    - freeswitch
    # The app's migrations create the views Kamailio loads at start-up.
    - qpbx_app
    - kamailio
    - nginx
    - monitoring
  post_tasks:
    - name: Backup key (authorized on the target by the next play)
      ansible.builtin.include_role:
        name: backup
        tasks_from: key
      when: qpbx_backup_enabled and not qpbx_restore_test

- name: Backup target
  hosts: qpbx_backup
  become: true
  roles:
    - backup_target

- name: Q-PBX backups
  hosts: qpbx
  become: true
  tasks:
    # A restore test (a copy next to the real server) must not write into its repository.
    - name: Backups
      ansible.builtin.include_role:
        name: backup
      when: qpbx_backup_enabled and not qpbx_restore_test
